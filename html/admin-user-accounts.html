<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User accounts · CARE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/shared/base.css">
  <link rel="stylesheet" href="../css/shared/layout.css">
  <link rel="stylesheet" href="../css/shared/components.css">
  <link rel="stylesheet" href="../css/shared/admin-table.css">
  <link rel="stylesheet" href="../css/pages/admin-user-accounts.css">
  <link rel="stylesheet" href="../css/shared/responsive.css?v=7">
</head>
<body data-role="admin" data-nav="accounts">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="header header--no-back">
      <div class="header__text">
        <h1 class="header__title" id="page-title">User accounts</h1>
        <p class="header__sub" id="page-sub">SQRT, clinic and administrator</p>
      </div>
    </header>
    <main class="content" id="content">
      <section class="card afilters">
        <form class="afilters__grid" id="filters" onsubmit="return false" style="grid-template-columns: 468fr 347fr 323fr 253fr">
          <div class="field"><label class="field__label" for="q">Search by name, username or department</label>
            <input class="input" id="q" name="q" type="search" placeholder="e.g. Fernandez or clinic" autocomplete="off"></div>
          <div class="field"><label class="field__label" for="role">Role</label>
            <select class="select" id="role" name="role"><option value="">All roles</option></select></div>
          <div class="field"><label class="field__label" for="status">Status</label>
            <select class="select" id="status" name="status"><option value="">All statuses</option></select></div>
          <a class="btn" href="admin-add-account.html" style="height:41px"><i data-icon="plus"></i>Add account</a>
        </form>
      </section>
      <p class="count-note" id="count"></p>
      <section class="card atable accounts">
        <div class="atable__head"><span>Name</span><span>Username</span><span>Role</span><span>Department</span><span>Status</span><span>Last Sign-in</span><span></span></div>
        <div id="rows"></div>
      </section>
      <div class="anote"><i class="icon" data-icon="lock"></i><span>Account details only. Medical information is not shown here.</span></div>
    </main>
  </div>
</div>

  <script src="../js/shared/config.js"></script>
  <script src="../js/shared/icons.js"></script>
  <script src="../js/shared/session.js"></script>
  <script src="../js/shared/api.js"></script>
  <script src="../js/shared/ui.js"></script>
  <script src="../js/shared/layout.js?v=7"></script>
  <script src="../js/shared/views.js"></script>
  <script src="../js/pages/admin-user-accounts.js"></script>
</body>
</html>
