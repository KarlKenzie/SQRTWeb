<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student record · CARE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/shared/base.css">
  <link rel="stylesheet" href="../css/shared/layout.css">
  <link rel="stylesheet" href="../css/shared/components.css">
  <link rel="stylesheet" href="../css/shared/student-record.css">
  <link rel="stylesheet" href="../css/pages/sqrt-student-record.css">
  <link rel="stylesheet" href="../css/shared/responsive.css?v=9">
</head>
<body data-role="sqrt" data-nav="search">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="header">
    <button class="back-btn" type="button" data-back="sqrt-student-search.html" aria-label="Go back"><i data-icon="arrow-left-circle"></i></button>
      <div class="header__text">
        <h1 class="header__title" id="page-title"></h1>
        
      </div>
    </header>
    <main class="content" id="content">
      <section class="banner">
        <i class="icon banner__icon" data-icon="lock"></i>
        <div class="banner__body">
          <h2 class="banner__title">Authorized access only</h2>
          <p class="banner__text">Access this record only when needed for emergency response. Your view is recorded.</p>
        </div>
      </section>

      <section class="card record" id="record"></section>

      <section class="banner">
        <i class="icon banner__icon" data-icon="eye"></i>
        <div class="banner__body">
          <h2 class="banner__title">Read-only</h2>
          <p class="banner__text">To report what you observed, file a rescue report.</p>
        </div>
      </section>

      <div class="button-row">
        <a class="btn btn--danger btn--wide" id="full-report" href="sqrt-new-rescue-report.html"><i data-icon="activity"></i>Submit rescue report</a>
        <a class="btn btn--wide" id="quick-report" href="sqrt-quick-rescue-report.html"><i data-icon="activity"></i>Quick report</a>
        <a class="btn btn--outline btn--wide" href="sqrt-student-search.html"><i data-icon="chevron-left"></i>Back to search</a>
      </div>
    </main>
  </div>
</div>

  <script src="../js/shared/config.js"></script>
  <script src="../js/shared/icons.js"></script>
  <script src="../js/shared/session.js"></script>
  <script src="../js/shared/api.js"></script>
  <script src="../js/shared/ui.js"></script>
  <script src="../js/shared/layout.js?v=9"></script>
  <script src="../js/shared/views.js"></script>
  <script src="../js/pages/sqrt-student-record.js"></script>
</body>
</html>
