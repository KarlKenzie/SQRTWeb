<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CARE – Password saved</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/login.css" />
  <link rel="stylesheet" href="../css/save-password.css" />
</head>
<body>
  <main class="page">
    <section class="hero hero--stacked" aria-label="About CARE">
      <div class="hero__brand">
        <h1 class="hero__logo">CARE</h1>
        <p class="hero__name">Campus Assistance &amp; Response Environment</p>
        <p class="hero__campus">CTU - Consolacion Campus</p>
      </div>
      <div class="hero__copy">
        <h2 class="hero__headline">Student medical information for <span>emergency response.</span></h2>
        <p class="hero__text">Connecting responders with essential student medical information when it matters most.</p>
      </div>
    </section>

    <section class="signin" aria-labelledby="saved-title">
      <div class="saved">
        <div class="saved__icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="24" cy="24" r="20"></circle>
            <path d="M15 25l6 6 12-13"></path>
          </svg>
        </div>
        <h2 id="saved-title" class="saved__title">Password saved</h2>
        <p class="saved__sub">Sign in again with your new password</p>

        <div class="saved__card">
          <p class="saved__label">Your password</p>
          <p class="saved__pw" id="saved-password">&nbsp;</p>
        </div>

        <a href="index.html" class="saved__signin" id="signin-link">Sign in</a>
      </div>
    </section>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/save-password.js"></script>
</body>
</html>
