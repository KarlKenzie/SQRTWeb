<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CARE – Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/login.css" />
</head>
<body>
  <main class="page">
    <section class="hero hero--oneline" aria-label="About CARE">
      <div class="hero__brand">
        <h1 class="hero__logo">CARE</h1>
        <p class="hero__name">Campus Assistance &amp; Response Environment</p>
        <p class="hero__campus">CTU - Consolacion Campus</p>
      </div>
      <div class="hero__copy">
        <h2 class="hero__headline">Student medical information for <span>emergency response.</span></h2>
        <p class="hero__text">Connecting responders with essential student medical information when it matters most.</p>
      </div>
    </section>

    <section class="signin" aria-labelledby="signin-title">
      <div class="signin__box">
        <h2 id="signin-title" class="signin__title">Sign in</h2>
        <p class="signin__sub">Accounts are issued by the University Clinic.</p>

        <div class="tabs" role="tablist" aria-label="Account type">
          <button type="button" class="tabs__btn is-active" role="tab" aria-selected="true" data-role="SQRT Responder">SQRT Responder</button>
          <button type="button" class="tabs__btn" role="tab" aria-selected="false" data-role="Clinic Staff">Clinic Staff</button>
        </div>

        <form id="signin-form" novalidate>
          <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" />
            <p class="field__error" id="username-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="field__pw">
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" />
              <button type="button" class="field__toggle" id="toggle-pw" aria-label="Show password" aria-pressed="false">Show</button>
            </div>
            <p class="field__error" id="password-error" role="alert"></p>
          </div>

          <a href="forgot-password.html" class="forgot" id="forgot">Forgot password?</a>

          <button type="submit" class="submit" id="submit">Sign in as SQRT Responder</button>
          <p class="form__message" id="form-message" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
